<!DOCTYPE html>
<html>
<head>
 <title>Styled HTML Page</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <h2>Main Heading</h2>
 <h3>Subheading</h3>
 <hr>
 <p>This is a paragraph styled using CSS</p>
 <div>
 This is a div element<span>This is a span element</span>
 </div>
 <p>Current time: <time>10:30 AM</time></p>
 <img src="" alt="Sample Image">
 <p>
 Visit <a href="https://google.com">Google</a>
 </p>
 <p class="highlight">
 This paragraph uses a class selector
 </p>
 <p class="center">
 This paragraph is Centered
 </p>
 <p id="special-paragraph">
 This paragraph uses an ID selector
 </p>
</body>
</html>
